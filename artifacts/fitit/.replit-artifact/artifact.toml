kind = "web"
previewPath = "/"
title = "ФИТИТ — Персональный план питания"
version = "1.0.0"
id = "artifacts/fitit"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19970

[services.development]
run = "pnpm --filter @workspace/fitit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fitit", "run", "build" ]
publicDir = "artifacts/fitit/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19970"
BASE_PATH = "/"
